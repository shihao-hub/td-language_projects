info:
  name: 读取不存在的配置
  type: http
  seq: 5

http:
  method: GET
  url: "{{base_url}}/api/app1/nope"

settings:
  encodeUrl: false

runtime:
  scripts:
    tests: |
      test("status is 404", () => {
        expect(res.getStatus()).to.equal(404);
      });
      test("code is not_found", () => {
        expect(res.getBody().code).to.equal("not_found");
      });

docs: |
  错误流：读取不存在的配置 `GET /api/{app}/{env}`。

  - 响应：404 + `{"code":"not_found","message":"config not found: app1/nope"}`
  - 用途：验证统一错误包络与稳定业务错误码，无副作用
  - 其他错误码（可用其他请求改参数验证）：
    - `invalid_name`（400）：把路径里的 app/env 改成 `bad.name` 之类不满足 `[a-zA-Z0-9_-]+` 的值
    - `invalid_json`（400）：跑 `01-put-config.yml` 时把 body 改成非法 JSON 或数组
