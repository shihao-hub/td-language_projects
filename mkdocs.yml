# docs/ 静态站点配置（Material for MkDocs）
# 构建入口：uv run .scripts/build_docs.py build；写作热刷新：uv run .scripts/build_docs.py serve
site_name: language_projects 文档库
# 留空 site_url 并关闭目录型 URL，保证 file:// 直开（双击 site/index.html 即可浏览）
site_url: ""
docs_dir: docs
site_dir: .mkdocs-site
use_directory_urls: false

# docs 里的 md 大量链接到 docs 外的仓库源码（file:// 下实际可达），
# 按"文档内死链"降级为忽略，避免 strict 构建误报
validation:
  links:
    not_found: ignore

theme:
  name: material
  language: zh
  features:
    - navigation.tracking
    - navigation.top
    - navigation.expand
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

plugins:
  - search:
      lang: zh
      # 中文搜索：material 的搜索插件在 jieba 可导入时自动把索引里的汉字按 jieba 词切分
      # 并用 \u200b 连接，zh 语言包又把 \u200b 与空白当分隔符，查询侧再按索引词典贪心切分。
      # jieba 由 .scripts/build_docs.py 的 PEP 723 依赖提供；缺了它 material 会静默跳过
      # 中文切分，中文搜索退化为整段匹配。无需额外钩子或后处理。
      # 如需补充专名词典，用上游选项 jieba_dict_user 指一个词表文件即可。
  # 目录即导航：按 docs/ 层级自动生成侧边栏树，中文文件名即导航标题
  - awesome-pages
